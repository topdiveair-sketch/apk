name: Build Tiguan TankPlaner APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TiguanTankPlanner/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        working-directory: TiguanTankPlanner
        run: gradle assembleDebug

      - name: Prepare installer
        run: cp TiguanTankPlanner/app/build/outputs/apk/debug/app-debug.apk TiguanTankPlaner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiguanTankPlaner-Installer
          path: TiguanTankPlaner.apk
          if-no-files-found: error
          retention-days: 30
