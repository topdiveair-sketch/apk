name: Tiguan TankPlaner APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TiguanTankPlanner/**'
      - '.github/workflows/tiguan-tankplanner-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        working-directory: TiguanTankPlanner
        run: gradle assembleDebug
      - name: Prepare installer
        run: cp TiguanTankPlanner/app/build/outputs/apk/debug/app-debug.apk TiguanTankPlaner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TiguanTankPlaner-APK
          path: TiguanTankPlaner.apk
          retention-days: 30
